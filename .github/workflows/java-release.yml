name: java-release

# Tag java-v1.0.0 -> build the jars and attach them to the GitHub Release.
# Nothing is uploaded to Maven Central from CI; use `mvn -P release deploy`
# locally (see java/PUBLISHING.md) when you want to publish there.

on:
  push:
    tags: ['java-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-release
  cancel-in-progress: false

jobs:
  build:
    name: build jars
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Check the tag matches the POM version
        if: startsWith(github.ref, 'refs/tags/java-v')
        run: |
          set -euo pipefail
          pom_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' java/pom.xml | head -1)
          tag_version="${{ github.ref_name }}"
          tag_version="${tag_version#java-v}"
          echo "pom=$pom_version tag=$tag_version"
          test "$pom_version" = "$tag_version"

      - name: Package
        # -P release only adds the sources/javadoc plugins here; signing and the
        # central upload bind to verify/deploy, which this command never reaches.
        run: mvn -B -f java/pom.xml -P release -pl core -am package -DskipTests

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp java/core/target/simdpaddleocr4j-*.jar dist/
          cd dist
          sha256sum ./*.jar > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: java-jars
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: java-jars
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # No actions/checkout in this job, so gh has no git remote to infer the
          # repository from: pass it explicitly.
          repo="$GITHUB_REPOSITORY"
          ls -l dist
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            gh release create "$tag" dist/* --repo "$repo" --title "$tag" --generate-notes
          fi
